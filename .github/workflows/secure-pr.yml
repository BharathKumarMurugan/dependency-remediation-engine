name: Secure PR checks

# trigger the workflow when a new PR is created or updated targeting main/master branches
on:
  pull_request:
    branches: ["main", "master"]

jobs:
  build_and_test:
    name: Build, Lint & Test (Node.js & Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Node.js Ecosystem Environment
      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node.js Dependencies
        run: npm ci

      - name: Build & Type Safety Sanitize (Node.js)
        run: npm run build

      - name: Run Node.js Test Suite (Jest)
        run: npm test

      # 2. Python Ecosystem Environment
      - name: Setup Python (v3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies & Linters
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest

      - name: Python Code Syntax & Lint Sanitize
        run: |
          ruff check . || true
          python -c "import compileall; compileall.compile_dir('.', quiet=1)"

      - name: Run Python Test Suite
        run: |
          if [ -d "tests" ] || ls test_*.py 1> /dev/null 2>&1; then
            pytest || python -m unittest discover
          else
            echo "No Python tests detected."
          fi

  security_scans:
    name: Security Analysis (CodeQL & Dependency Review)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Initialize CodeQL SAST for both Node.js (JS/TS) and Python
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: "javascript-typescript, python"

      # Dependency Vulnerability Review (catches npm & PyPI advisories)
      - name: Dependency Review
        uses: actions/dependency-review-action@v4

      # Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
